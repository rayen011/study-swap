name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # `firebase_options.dart` is committed, so the app builds without extra
      # setup. It holds client config, not secrets — access is controlled by
      # firestore.rules and storage.rules.
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  functions:
    name: Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Firestore emulator needs a JDK; 21 is the minimum firebase-tools
      # accepts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - run: npm run build
        working-directory: functions

      # `build` compiles src only; this covers the tests too.
      - run: npm run typecheck
        working-directory: functions

      # The auction closer moves credits inside a transaction, so it is tested
      # against a real emulator rather than a mocked Firestore.
      - name: Run function tests against the emulator
        run: npm --prefix functions run test:emulate

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Firestore and Storage emulators need a JDK; 21 is the minimum
      # firebase-tools accepts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      - run: npm ci
        working-directory: rules-tests

      - name: Run rules tests against the emulator
        run: |
          npx --yes firebase-tools emulators:exec             --only firestore,storage             --project studyswap-rules-test             "npm --prefix rules-tests test"
